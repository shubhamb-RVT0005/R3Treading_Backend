# =====================================================
# APPLICATION
# =====================================================

spring.application.name=OTP-SERVICE
#spring.application.name=OTP-Service1
server.port=8083


# =====================================================
# MYSQL DATABASE
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/r3test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

spring.datasource.username=root

spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# NOTIFICATION SERVICE
# =====================================================

notification.service.url=http://localhost:8084


# =====================================================
# EUREKA
# =====================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true


# =====================================================
# LOGGING
# =====================================================

logging.level.com.r3vision=DEBUG

logging.level.org.springframework.cloud.openfeign=DEBUG

